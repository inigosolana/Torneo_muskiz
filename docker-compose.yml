version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_GEMINI_API_KEY: ${GEMINI_API_KEY}
    container_name: torneo_muskiz_web
    restart: always
    environment:
      - HOST=0.0.0.0 # Necesario para que Vite responda a Traefik (si se usara dev mode)
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      # Regla para tu dominio específico
      - "traefik.http.routers.torneo.rule=Host(`torneomuskizbmplaya.es`) || Host(`www.torneomuskizbmplaya.es`)"
      - "traefik.http.routers.torneo.entrypoints=web"
      # Usamos el puerto 80 porque tu Dockerfile actual usa Nginx (Producción)
      - "traefik.http.services.torneo.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
