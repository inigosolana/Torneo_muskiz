version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_GEMINI_API_KEY: ${GEMINI_API_KEY}
    container_name: torneo_muskiz_web
    restart: always
    environment:
      - HOST=0.0.0.0
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.torneo.rule=Host(`torneomuskizbmplaya.es`) || Host(`www.torneomuskizbmplaya.es`)"
      # --- CAMBIOS PARA EL SSL (HTTPS) ---
      - "traefik.http.routers.torneo.entrypoints=websecure" # Cambiado a websecure
      - "traefik.http.routers.torneo.tls=true" # Activamos el candado
      - "traefik.http.routers.torneo.tls.certresolver=letsencrypt" # Pedimos el certificado
      # -----------------------------------
      - "traefik.http.services.torneo.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
