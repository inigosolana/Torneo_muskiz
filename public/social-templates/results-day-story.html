<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Resultados del día — Story</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px; height: 1920px;
      font-family: system-ui, sans-serif;
      background: linear-gradient(180deg, #0b0f14, #1a2e35);
      color: #fff;
      padding: 64px 48px;
    }
    h1 { font-size: 48px; font-weight: 900; }
    h2 { font-size: 32px; color: #0df2f2; margin-bottom: 40px; }
    .row { padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
    .line1 { font-size: 22px; color: #94a3b8; }
    .line2 { font-size: 30px; font-weight: 700; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>{{title}}</h1>
  <h2>{{subtitle}}</h2>
  <div class="row">
    <div class="line1">{{line1}}</div>
    <div class="line2">{{line2}}</div>
  </div>
</body>
</html>
