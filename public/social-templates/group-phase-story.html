<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Fase de grupos — Story</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px; height: 1920px;
      font-family: system-ui, sans-serif;
      background: linear-gradient(165deg, #0b0f14, #0a3d3d);
      color: #fff;
      padding: 56px 48px;
    }
    h1 { font-size: 44px; font-weight: 900; color: #0df2f2; }
    h2 { font-size: 28px; margin: 12px 0 32px; }
    .block { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,.12); }
    .g { font-size: 26px; font-weight: 800; color: #0df2f2; }
    .t { font-size: 24px; margin-top: 8px; line-height: 1.35; }
  </style>
</head>
<body>
  <h1>FASE DE GRUPOS</h1>
  <h2>{{subtitle}}</h2>
  <div class="block">
    <div class="g">Grupo {{group}}</div>
    <div class="t">{{teams}}</div>
  </div>
</body>
</html>
